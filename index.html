<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neural Racers — AI Lab</title><link rel="stylesheet" href="style.css"></head>
<body>
<main><canvas id="c"></canvas><div id="bar"></div></main>

  <h2>CHALLENGE</h2><div id="challenge"></div>
  <h2>LEADERBOARD</h2><div id="lb"></div>
  <h2>FITNESS (best / mean)</h2><canvas id="ch" width="240" height="80"></canvas>
